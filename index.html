<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crypto Tax & Fee Estimator Pro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 6px; border: none; font-size: 16px; }
        input { background: #334155; color: #fff; }
        button { background: #10b981; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #059669; }
        .pay-section { margin-top: 30px; text-align: center; border-top: 1px solid #334155; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crypto Tax & Fee Estimator</h1>
        <p>Calcula de forma instantánea tus comisiones estimadas en redes TRC20, ERC20 y Polygon.</p>
        <label>Monto en USD:</label>
        <input type="number" id="amount" value="100" placeholder="100">
        <button onclick="calculate()">Calcular Comisión</button>
        <h3 id="result">Comisión estimada: $1.00 USD</h3>

        <div class="pay-section">
            <h3>Apoya este Micro-SaaS o desbloquea soporte Pro</h3>
            <p>Contribución voluntaria o pago de licencia ($5 USD):</p>
            <a href="https://paypal.me/LucianoBenechCenoz" target="_blank">
                <button style="background: #0070ba;">Pagar / Donar vía PayPal ($5)</button>
            </a>
        </div>
    </div>
    <script>
        function calculate() {
            let amt = document.getElementById('amount').value;
            let fee = amt * 0.005;
            document.getElementById('result').innerText = 'Comisión estimada: $' + fee.toFixed(2) + ' USD';
        }
    </script>
</body>
</html>
